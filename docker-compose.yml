services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hanwool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: hanwool_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hanwool}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Docker 서비스명 기반 URL은 .env 값을 덮어씀
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hanwool}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/hanwool_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 업로드 사진/서명 영구 보존 — 재빌드(up -d --build) 시에도 유지
      - photos_data:/app/photos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KAKAO_MAP_KEY: ${KAKAO_MAP_KEY:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/hanwool/downloads:/usr/share/nginx/html/downloads:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  photos_data:
