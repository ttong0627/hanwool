services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 640m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hanwool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: hanwool_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hanwool}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup_db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hanwool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: hanwool_backup_db
    volumes:
      - postgres_backup_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hanwool} -d hanwool_backup_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_backup:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hanwool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: hanwool_db
      BACKUP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      BACKUP_POSTGRES_DB: hanwool_backup_db
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-7200}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/db_backup_loop.sh:/usr/local/bin/db_backup_loop.sh:ro
      - ./scripts/restore_primary_from_backup.sh:/usr/local/bin/restore_primary_from_backup.sh:ro
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
      backup_db:
        condition: service_healthy
    command: ["sh", "/usr/local/bin/db_backup_loop.sh"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ./backend/.env
    environment:
      # Docker 서비스명 기반 URL은 .env 값을 덮어씀
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hanwool}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/hanwool_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 업로드 사진/서명 영구 보존 — 재빌드(up -d --build) 시에도 유지
      - photos_data:/app/photos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KAKAO_MAP_KEY: ${KAKAO_MAP_KEY:-}
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/hanwool/downloads:/usr/share/nginx/html/downloads:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  postgres_backup_data:
  db_backups:
  photos_data:
