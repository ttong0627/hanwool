# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name ga.wssc.kr;
    return 301 https://$host$request_uri;
}

# HTTPS 메인
server {
    listen 443 ssl;
    server_name ga.wssc.kr;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/ga.wssc.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ga.wssc.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://t1.daumcdn.net https://dapi.kakao.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://*.daumcdn.net https://t1.kakaocdn.net; connect-src 'self' wss://ga.wssc.kr https://dapi.kakao.com https://cdn.jsdelivr.net; frame-src https://daumcdn.net;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # 해시된 정적 자산(index-XXXX.js 등)은 파일명이 바뀌므로 장기 캐시 안전
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        # index.html은 항상 최신을 받게 해 배포(업데이트) 즉시 반영되도록 한다
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # 헬스체크 — 백엔드로 프록시(이전엔 SPA로 빠져 모니터링이 무력화됨)
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    location /photos/ {
        proxy_pass http://backend:8000;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
